<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Weather Conditions</title><link rel="icon" href="https://fav.farm/partly-sunny"><meta name="viewport" content="width=device-width,initial-scale=1"><script defer="defer" src="bundle.js"></script><link href="main.css" rel="stylesheet"></head><body><header><nav><div class="menu"><div class="menu-left"><a class="menu-item menu-icon icon-now"></a> <a class="menu-item menu-icon icon-today"></a> <a class="menu-item menu-icon icon-hour"></a> <a class="menu-item menu-icon icon-day"></a> <a class="menu-item menu-icon icon-aqi"></a> <a class="menu-item menu-icon icon-charts"></a></div><div class="menu-right"><a class="menu-item menu-icon icon-location find"></a> <a class="menu-item menu-icon icon-settings settings"></a> <a class="menu-item menu-icon icon-info"></a> <a class="menu-item menu-icon icon-credits"></a></div></div></nav></header><div id="search" class="modal"><div class="modal-content"><div class="modal-header"><span class="close">&times;</span><h2>Location Search</h2></div><div class="modal-body"><div class="group"><input class="input" placeholder="City Name or Postal code"> <a class="search"></a></div></div><div class="modal-footer"><div class="results"><div class="info">Search by city name or postal code</div></div><div class="searches"><div class="searches-title">Previously searched locations</div></div></div></div></div><div id="preferences" class="modal"><div class="modal-content"><div class="modal-header"><span class="close2">&times;</span><h2>Settings</h2></div><div class="modal-body"><div class="group2"><fieldset class="settings-temp"><legend>Temperature</legend><div class="switch-field"><input type="radio" id="celsius" name="temp" value="celsius"> <label for="celsius">&deg;C</label> <input type="radio" id="fahrenheit" name="temp" value="fahrenheit"> <label for="fahrenheit">&deg;F</label></div></fieldset><fieldset class="settings-precipitation"><legend>Precipitation</legend><div class="switch-field"><input type="radio" id="millimeter" name="precip" value="mm"> <label for="millimeter">mm</label> <input type="radio" id="inch" name="precip" value="inch"> <label for="inch">in</label></div></fieldset><fieldset class="settings-wind"><legend>Wind Speed</legend><div class="switch-field"><div class="wind-left"><input type="radio" id="kmh" name="wind" value="kmh"> <label for="kmh">km/h</label> <input type="radio" id="mph" name="wind" value="mph"> <label for="mph">mph</label></div><div class="wind-right"><input type="radio" id="ms" name="wind" value="ms"> <label for="ms">m/s</label> <input type="radio" id="knots" name="wind" value="kn"> <label for="knots">knots</label></div></div></fieldset><fieldset class="settings-updates"><legend>Auto Updates</legend><div class="switch-field"><input type="radio" id="on" name="updates" value="on"> <label for="on">On</label> <input type="radio" id="off" name="updates" value="off"> <label for="off">Off</label></div></fieldset><fieldset class="settings-results"><legend>Search Results</legend><input type="range" name="results" min="1" max="100" step="1" list="steplist" autocomplete="off" oninput="this.nextElementSibling.value = this.value"><output id="results"></output></fieldset></div></div><div class="modal-footer"><a class="save">Submit</a></div></div></div><main><div class="lbar"></div><section class="container"><div class="current panel" id="s-now"></div><div class="daily panel"></div><div class="hourly panel"></div><div class="forecast panel"></div><div class="aqi-hour panel"></div><div class="charts chartsWrapper panel"><canvas id="myCharts"></canvas></div></section></main><footer class="footer"><p class="spacer">&nbsp;</p></footer></body></html>
